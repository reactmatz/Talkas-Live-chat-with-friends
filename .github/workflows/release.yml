name: release

# Builds the Windows installer and publishes it on the Releases page (the in-app updater reads it). Two ways in:
#  - push a version tag (v1.2.3), or
#  - bump "version" in package.json on main: the release and its tag are created here, if they don't exist yet.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pick the version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.3 (three numbers)."
            exit 1
          fi
          publish=true
          # A package.json change on main that isn't a new version (or a manual run): build only.
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "v$v" >/dev/null 2>&1; then publish=false; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/tags/v* ]]; then publish=false; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $v, publish: $publish"
      - run: npm ci
      - name: Use the version
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npm run dist -- --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          files=(release/*.exe release/*.blockmap release/latest.yml)
          # Release already created on github.com (Draft a new release → Publish)? Just attach the files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "Talkas $TAG" --generate-notes
          fi
